name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Install dependencies
        run: npm ci

      - name: Configure macOS signing/notarization
        if: runner.os == 'macOS'
        shell: pwsh
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:APPLE_CERTIFICATE_P12_BASE64)
          $hasCertPassword = -not [string]::IsNullOrWhiteSpace($env:APPLE_CERTIFICATE_PASSWORD)
          $hasNotary = (
            -not [string]::IsNullOrWhiteSpace($env:APPLE_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:APPLE_APP_SPECIFIC_PASSWORD) -and
            -not [string]::IsNullOrWhiteSpace($env:APPLE_TEAM_ID)
          )

          if ($hasCert -and $hasCertPassword -and $hasNotary) {
            "CSC_LINK=$($env:APPLE_CERTIFICATE_P12_BASE64)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CSC_KEY_PASSWORD=$($env:APPLE_CERTIFICATE_PASSWORD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CSC_IDENTITY_AUTO_DISCOVERY=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "APPLE_ID=$($env:APPLE_ID)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "APPLE_APP_SPECIFIC_PASSWORD=$($env:APPLE_APP_SPECIFIC_PASSWORD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "APPLE_TEAM_ID=$($env:APPLE_TEAM_ID)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Apple signing + notarization enabled."
          } else {
            "CSC_LINK=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CSC_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "CSC_IDENTITY_AUTO_DISCOVERY=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Apple secrets missing; building unsigned/unnotarized macOS artifacts."
          }

      - name: Build desktop distributables
        run: npm run dist:desktop

      - name: Collect release assets
        shell: pwsh
        run: |
          $source = "dist/desktop"
          $target = "out/release-assets"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $patterns = @("*.dmg", "*.zip", "*.exe", "*.AppImage", "*.deb", "*.blockmap", "*.yml", "*.yaml")
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $source -File -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination (Join-Path $target $_.Name)
            }
          }
          if (-not (Get-ChildItem -Path $target -File -ErrorAction SilentlyContinue)) {
            Write-Error "No release assets found in $source"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: out/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenCorpo ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
